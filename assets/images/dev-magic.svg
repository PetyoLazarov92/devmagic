<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Dev Magic - WordPress Local Development Tool</title>
  <desc id="desc">Animated logo with rocket, badges, sparkles and subtle shadows — balanced for light and dark themes.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="rocketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c82f6"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4e50"/>
    </linearGradient>

    <!-- Glow & Shadow filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)" />
    </filter>

    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.18)" />
    </filter>

    <g id="spark">
      <polygon points="0,-9 3,-3 9,0 3,3 0,9 -3,3 -9,0 -3,-3"/>
    </g>

    <style><![CDATA[
      :root {
        --text-main: #0c1a2f;
        --text-sub: #4b5b6a;
        --badge-bg: #f6f8fc;
        --badge-border: #e1e8f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-main: #eaf1ff;
          --text-sub: #a8b7cc;
          --badge-bg: #1d2533;
          --badge-border: #2c3649;
        }
      }

      .rocket { transform-origin: 60px 80px; animation: bob 3s ease-in-out infinite; }
      @keyframes bob {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .flame { animation: flame 0.5s ease-in-out infinite; transform-origin: center; }
      @keyframes flame {
        0%,100% { transform: scale(1) opacity:1; }
        50% { transform: scale(1.2) opacity:0.8; }
      }

      .sparkle { animation: sparkle 4s linear infinite; opacity: 0; transform-origin: center; }
      @keyframes sparkle {
        0% { opacity: 0; transform: scale(0.4) rotate(0deg); }
        10% { opacity: 1; transform: scale(1.2) rotate(15deg); }
        50% { opacity: 0.8; transform: scale(1) rotate(30deg); }
        100% { opacity: 0; transform: scale(0.4) rotate(45deg); }
      }

      .fadeUp { opacity: 0; animation: fadeUp 1.2s ease forwards; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px);}
        to { opacity: 1; transform: translateY(0);}
      }

      .badge {
        font-family: Inter, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: var(--text-main);
      }

      .badge-bg {
        fill: var(--badge-bg);
        stroke: var(--badge-border);
      }
    ]]></style>
  </defs>

  <!-- Left section: Rocket background (slightly wider and higher) -->
  <g transform="translate(50,80)" filter="url(#softShadow)">
    <rect width="400" height="180" rx="24" fill="var(--badge-bg)" stroke="var(--badge-border)" />
    <g class="rocket" transform="translate(80,30)">
      <!-- Rocket body -->
      <path d="M60 10 C75 35 90 60 90 90 C90 115 75 130 60 130 C45 130 30 115 30 90 C30 60 45 35 60 10 Z" fill="url(#rocketGrad)" />
      <circle cx="60" cy="75" r="12" fill="#fff"/>
      <circle cx="60" cy="75" r="8" fill="#1a73e8"/>
      <!-- Side wings -->
      <path d="M35 120 C20 130 20 150 38 160 L48 130 Z" fill="#e65f00"/>
      <path d="M85 120 C100 130 100 150 82 160 L72 130 Z" fill="#e65f00"/>
      <!-- Flame -->
      <g class="flame">
        <path d="M60 130 C55 140 57 150 60 160 C63 150 65 140 60 130 Z" fill="url(#flameGrad)"/>
      </g>
    </g>
    <text x="190" y="105" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="var(--text-main)">
      🚀 Fast
    </text>
  </g>

  <!-- Title -->
  <g transform="translate(490,145)" filter="url(#textShadow)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="700" fill="var(--text-main)" class="fadeUp">
      Dev Magic
    </text>
  </g>

  <!-- Feature badges -->
  <g transform="translate(490,180)" filter="url(#softShadow)">
    <rect x="0" y="0" width="120" height="36" rx="8" class="badge-bg" />
    <text x="18" y="24" class="badge">🔒 SSL Ready</text>

    <rect x="140" y="0" width="165" height="36" rx="8" class="badge-bg" />
    <text x="155" y="24" class="badge">⚙️ Apache Config</text>

    <rect x="325" y="0" width="155" height="36" rx="8" class="badge-bg" />
    <text x="340" y="24" class="badge">📂 Project Cloning</text>
  </g>

  <!-- Description -->
  <g transform="translate(490,240)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="18" fill="var(--text-sub)" class="fadeUp" style="animation-delay:0.3s;">
      WordPress Local Development Environment Tool
    </text>
    <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--text-sub)" class="fadeUp" style="animation-delay:0.5s;">
      Automated setup with SSL, Apache, and project cloning.
    </text>
  </g>

  <!-- Sparkles -->
  <use href="#spark" x="200" y="80" fill="#ffd86b" class="sparkle" style="animation-delay:0.2s; transform:scale(1.1)"/>
  <use href="#spark" x="320" y="60" fill="#fff7bb" class="sparkle" style="animation-delay:0.8s; transform:scale(0.9)"/>
  <use href="#spark" x="420" y="90" fill="#a3ffbf" class="sparkle" style="animation-delay:1.4s; transform:scale(1.3)"/>
  <use href="#spark" x="640" y="50" fill="#ffd86b" class="sparkle" style="animation-delay:2.0s; transform:scale(1.2)"/>
  <use href="#spark" x="760" y="70" fill="#fff7bb" class="sparkle" style="animation-delay:2.6s; transform:scale(1.1)"/>
  <use href="#spark" x="900" y="100" fill="#a3ffbf" class="sparkle" style="animation-delay:3.0s; transform:scale(0.9)"/>
  <use href="#spark" x="650" y="180" fill="#ffd86b" class="sparkle" style="animation-delay:3.2s; transform:scale(1.4)"/>
  <use href="#spark" x="500" y="200" fill="#fff7bb" class="sparkle" style="animation-delay:3.6s; transform:scale(1.3)"/>
  <use href="#spark" x="850" y="160" fill="#a3ffbf" class="sparkle" style="animation-delay:4.0s; transform:scale(1.2)"/>
</svg>
